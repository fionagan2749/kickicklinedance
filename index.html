<meta charset="utf-8">

<title>KickickLineDance</title>

<style>
/* Layout: one phone-width column; glass cards on a pastel bloom background; sticky glass header, floating glass nav. */
:root{
  --ink:#1E1B4B; --muted:#6B6688; --bg:#FCF3EE;
  --rim:linear-gradient(135deg,#FFB3D6 0%,#fff 20%,#9FE6FF 40%,#fff 58%,#C9B2FF 76%,#FFC9A3 92%);
  --cta:linear-gradient(90deg,#FF8A3D 0%,#FF4F8B 50%,#A63CF0 100%);
  --new:#1FA971; --hot:#E8475B;
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  background:
    radial-gradient(360px 360px at 0% 0%,rgba(255,205,215,.55),transparent 70%),
    radial-gradient(360px 360px at 100% 30%,rgba(201,178,255,.45),transparent 70%),
    radial-gradient(360px 360px at 0% 75%,rgba(255,201,163,.45),transparent 70%),
    linear-gradient(#FCF3EE,#F6EEF8);
  background-attachment:fixed;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #A63CF0;outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}

/* glass */
.glass,.glass-pill{border:1.3px solid transparent;
  background:linear-gradient(165deg,rgba(255,255,255,.82),rgba(255,255,255,.5)) padding-box, var(--rim) border-box;
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1.5px 0 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -10px 18px -14px rgba(139,92,246,.25), 0 8px 24px 0 rgba(139,92,246,.13), -8px 12px 24px -18px rgba(236,72,153,.35), 10px -4px 22px -18px rgba(6,182,212,.35)}
.glass{border-radius:24px}
.glass-pill{border-radius:999px}
.cta{border:0;background:var(--cta);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 8px 18px -8px rgba(255,79,139,.6);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* header */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:15px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{font-weight:800;font-size:clamp(14px,4.1vw,18px);letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header::before{content:"";position:absolute;inset:0 -16px;z-index:-1;background:linear-gradient(rgba(252,243,238,.85),rgba(252,243,238,.55));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1.3px solid transparent;position:relative}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--hot);border:2px solid #fff}
.lang{display:flex;padding:3px;gap:2px}
.lang button{border:0;background:transparent;font-weight:700;font-size:13px;padding:7px 9px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

section{margin-top:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-head h2{font-size:19px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-head a{font-size:14px;font-weight:700;color:#A63CF0;text-decoration:none}
.badge{font-size:11px;font-weight:800;color:#fff;background:var(--hot);border-radius:999px;padding:2px 8px;letter-spacing:.3px}

/* hero: swipeable banner (team photo + KICKICK poster) */
.hero{margin-top:6px;position:relative;border-radius:26px;overflow:hidden;border:1.3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--rim) border-box;box-shadow:0 18px 40px -18px rgba(166,60,240,.55)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:2.05/1;overflow:hidden;background:#2a1030}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .blur{filter:blur(18px) saturate(1.3);transform:scale(1.2);opacity:.85}
.slide .fit{object-fit:contain}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;background:linear-gradient(transparent,rgba(30,12,40,.78))}
.slide .cap small{display:block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.9}
.slide .cap b{display:block;font-size:17px;line-height:1.2;font-weight:800;text-wrap:balance}
.dots{position:absolute;top:10px;right:12px;display:flex;gap:5px}
.dots button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.55)}
.dots button[aria-current="true"]{width:20px;background:#fff}
.hero-cta{display:flex;gap:10px;margin-top:12px}
.hero-cta a{flex:1;justify-content:center}
.hero-cta .ghost{border:1.3px solid transparent;font-weight:700;border-radius:999px;padding:10px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* invite */
.invite{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;margin-top:14px}
.invite img{width:40px;height:40px;object-fit:contain}
.invite span{flex:1;font-weight:700;font-size:15px;min-width:0}
.invite .cta{padding:9px 14px;font-size:14px}

/* carousels */
.rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex-shrink:0}

.act{width:78%;max-width:320px;display:flex;overflow:hidden;min-height:132px;text-decoration:none}
.act .txt{padding:14px 4px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.tag{align-self:flex-start;background:linear-gradient(90deg,#FF4F8B,#E040C8);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.act b{font-size:16.5px;line-height:1.2}
.act small{font-size:14px;color:var(--muted);font-weight:600}
.act img{width:46%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}

/* new intake */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1.3px solid transparent;font-weight:700;font-size:14px;padding:8px 14px}
.chips button[aria-pressed="true"]{background:var(--cta) padding-box,var(--cta) border-box;color:#fff;box-shadow:0 6px 14px -8px rgba(255,79,139,.7)}
.poster{width:58%;max-width:240px;overflow:hidden;display:flex;flex-direction:column}
.poster a{position:relative;display:block}
.poster img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top}
.poster .new{position:absolute;top:10px;left:10px;background:var(--new);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.poster .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.poster .area{font-weight:800;font-size:15.5px;line-height:1.25}
.poster .when{font-size:14px;font-weight:600}
.poster .who{font-size:12.5px;color:var(--muted)}
.poster .cta{margin-top:8px;justify-content:center;padding:8px 14px;font-size:14px}
.empty{padding:18px;color:var(--muted);font-size:14px}

/* tickets */
.ticket{display:flex;align-items:stretch;overflow:hidden;min-height:118px}
.ticket .txt{padding:14px 0 14px 16px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.ticket b{font-size:16.5px}
.price{display:flex;align-items:baseline;gap:8px}
.price strong{font-size:32px;color:#E5283C;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:700}
.ticket .side{width:42%;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px;background-size:cover;background-position:center}
.ticket .save{position:absolute;left:-6px;top:12px;background:#E5283C;color:#fff;font-weight:800;font-size:12.5px;border-radius:12px;padding:6px 8px;text-align:center;line-height:1.1;transform:rotate(-6deg)}

/* teachers */
.teacher{width:132px;overflow:hidden;text-align:center;text-decoration:none}
.teacher img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:top}
.teacher .nm{font-weight:800;font-size:15px;padding:8px 6px 0;line-height:1.2}
.teacher .rl{font-size:12.5px;color:var(--muted);padding:2px 6px 10px}

/* group */
.group{display:flex;align-items:center;gap:14px;padding:16px}
.group img{width:44%;max-width:180px;mix-blend-mode:multiply}
.group p{margin:0;font-size:14px;color:var(--muted)}
.group b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}

.foot{margin:22px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.foot a{color:#A63CF0;font-weight:700}

/* bottom nav */
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 8px;z-index:30}
nav.tabbar a,nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:18px}
nav.tabbar .on{color:#2563EB;background:linear-gradient(180deg,rgba(191,219,254,.7),rgba(255,255,255,.4))}
nav.tabbar svg{width:24px;height:24px}
nav.tabbar .qr{margin-top:-30px}
nav.tabbar .qr .orb{width:62px;height:62px;border-radius:50%;background:var(--cta);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(255,79,139,.7), inset 0 2px 0 rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.8)}
nav.tabbar .qr span{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40}
@media (prefers-reduced-motion:no-preference){.rail{scroll-behavior:smooth}}
</style>
</head>

    {img:'intake-oug-sat.jpg',area:'kl',en:['OUG · Dewan Komuniti','Sat 9:00 AM–12:00 PM','Wendy Loh & Rowena Hu'],zh:['OUG · 华联会所','星期六 早上 9:00–12:00','Wendy Loh & Rowena Hu']}
  ];
  var AREAS=[['all'],['kl','KL','吉隆坡'],['puchong','Puchong','蒲种'],['kajang','Kajang','加影'],['sk','Seri Kembangan','Seri Kembangan']];
  var TEACHERS=[
    {img:'t-wendy.jpg',en:['Wendy Loh','Founder · Instructor'],zh:['猫姐 Wendy Loh','创办人 · 导师']},
    {img:'t-melvin.jpg',en:['Melvin','Instructor · Seri Kembangan'],zh:['猫哥 Melvin','导师 · Seri Kembangan']},
    {img:'t-ann.jpg',en:['Ann Soh','Instructor · Puchong'],zh:['猫妹 Ann Soh','导师 · 蒲种']},
    {img:'t-adelyn.jpg',en:['Adelyn Pong','Instructor · Cheras'],zh:['Adelyn Pong','导师 · 蕉赖']},
    {img:'t-jane.jpg',en:['Jane Tang','Instructor · Kajang'],zh:['Jane Tang','导师 · 加影']},
    {img:'t-wiwien.jpg',en:['Wiwien Loh','Instructor · Puchong'],zh:['Wiwien Loh','导师 · 蒲种']},
    {img:'t-rowena.jpg',en:['Rowena Hu','Co-instructor · OUG'],zh:['Rowena Hu','协助导师 · OUG']}
  ];
  var st={lang:'en',area:'all'};
  try{ if(localStorage.getItem('kld_lang')==='zh') st.lang='zh'; }catch(e){}

  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function renderIntake(){
    var t=T[st.lang], a=document.getElementById('areas'); a.innerHTML='';
    AREAS.forEach(function(x){
      var b=el('button','glass-pill', x[0]==='all'?t.all:(st.lang==='zh'?x[2]:x[1])); b.type='button';
      b.setAttribute('aria-pressed', st.area===x[0]);
      b.onclick=function(){ st.area=x[0]; renderIntake(); };
      a.appendChild(b);
    });
    var r=document.getElementById('posters'); r.innerHTML='';
    INTAKE.filter(function(k){return st.area==='all'||k.area===st.area;}).forEach(function(k){
      var d=k[st.lang], c=el('div','poster glass');
      var link=el('a'); link.href=k.img; link.target='_blank'; link.rel='noopener';
      var im=el('img'); im.src=k.img; im.alt=d[0]; im.loading='lazy'; link.appendChild(im); link.appendChild(el('span','new','NEW'));
      var info=el('div','info'); info.appendChild(el('span','area',d[0])); info.appendChild(el('span','when',d[1])); info.appendChild(el('span','who',d[2]));
      var j=el('button','cta',t.join); j.type='button'; j.setAttribute('data-soon',''); j.onclick=soon; info.appendChild(j);
      c.appendChild(link); c.appendChild(info); r.appendChild(c);
    });
    r.scrollLeft=0;
  }
  function renderTeachers(){
    var r=document.getElementById('teacherRail'); r.innerHTML='';
    TEACHERS.forEach(function(p){
      var d=p[st.lang], c=el('div','teacher glass'), im=el('img'); im.src=''+p.img; im.alt=d[0]; im.loading='lazy';
      c.appendChild(im); c.appendChild(el('div','nm',d[0])); c.appendChild(el('div','rl',d[1])); r.appendChild(c);
    });
  }
  function render(){
    var t=T[st.lang]; document.documentElement.lang=st.lang==='zh'?'zh':'en';
    document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent=t[e.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===st.lang); });
    renderIntake(); renderTeachers();
    try{ localStorage.setItem('kld_lang',st.lang); }catch(e){}
  }
  var tt; function soon(e){ if(e) e.preventDefault(); var x=document.getElementById('toast'); x.textContent=T[st.lang].soon; x.hidden=false; clearTimeout(tt); tt=setTimeout(function(){x.hidden=true;},1600); }
  document.querySelectorAll('[data-soon]').forEach(function(b){ b.addEventListener('click',soon); });
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click',function(){ st.lang=b.dataset.lang; render(); }); });
  document.querySelectorAll('[data-screen-link]').forEach(function(a){ a.addEventListener('click',function(){ try{ localStorage.setItem('kld_screen',a.dataset.screenLink); }catch(e){} }); });
  /* hero slider: dots + gentle autoplay, paused when the viewer interacts or prefers reduced motion */
  (function(){
    var sl=document.getElementById('slides'), dots=[].slice.call(document.querySelectorAll('#dots button')), i=0, timer;
    function go(n){ i=(n+dots.length)%dots.length; sl.scrollTo({left:sl.clientWidth*i,behavior:'smooth'}); }
    function mark(){ var n=Math.round(sl.scrollLeft/sl.clientWidth); dots.forEach(function(d,k){ d.setAttribute('aria-current', k===n); }); i=n; }
    sl.addEventListener('scroll',function(){ requestAnimationFrame(mark); });
    dots.forEach(function(d,k){ d.addEventListener('click',function(){ stop(); go(k); }); });
    function stop(){ clearInterval(timer); timer=null; }
    sl.addEventListener('touchstart',stop,{passive:true}); sl.addEventListener('pointerdown',stop);
    if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) timer=setInterval(function(){ go(i+1); },4500);
  })();
  render();
})();
</script>
