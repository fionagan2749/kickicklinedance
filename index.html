<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KickickLineDance</title>
<style>
:root{--bg:#F6F1FA;--fg:#24203A;--muted:#7A7390;--line:#E6DCF0;--pill:#FFFFFF;--on:#24203A;--onfg:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#17141F;--fg:#F2EEF8;--muted:#A79FBA;--line:#2E2840;--pill:#231E2E;--on:#F2EEF8;--onfg:#17141F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{font-size:17px;margin:0;font-weight:700}
.seg{display:flex;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
.seg button:focus-visible{outline:2px solid #A63CF0;outline-offset:2px}
.screens{width:100%}
.screens button{flex:1;padding:7px 8px;font-size:13px}
img{display:block;width:100%;height:auto;border-radius:22px;border:1px solid var(--line)}
footer{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>KickickLineDance</h1>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
  <div class="seg screens" role="group" aria-label="Screen">
    <button type="button" data-screen="admin" aria-pressed="true" data-en="Admin · Wendy" data-zh="管理后台 · Wendy"></button>
    <button type="button" data-screen="student" aria-pressed="false" data-en="Student Home" data-zh="学生首页"></button>
    <button type="button" data-screen="classes" aria-pressed="false" data-en="Classes" data-zh="课程"></button>
  </div>
  <img id="shot" src="admin-en.jpg" alt="KickickLineDance screen design">
  <footer data-en="Design preview · sample data · buttons not active yet" data-zh="设计稿预览 · 示范数据 · 按钮暂不可点"></footer>
</div>
<script>
(function(){
  var st={lang:'en',screen:'admin'};
  try{ st.lang = localStorage.getItem('kld_lang')==='zh' ? 'zh' : 'en'; var sc = localStorage.getItem('kld_screen'); st.screen = (sc==='student'||sc==='classes') ? sc : 'admin'; }catch(e){}
  function render(){
    document.documentElement.lang = st.lang;
    document.getElementById('shot').src = st.screen + '-' + st.lang + '.jpg';
    document.querySelectorAll('[data-en]').forEach(function(e){ e.textContent = e.getAttribute('data-' + st.lang); });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===st.lang); });
    document.querySelectorAll('[data-screen]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.screen===st.screen); });
    try{ localStorage.setItem('kld_lang',st.lang); localStorage.setItem('kld_screen',st.screen); }catch(e){}
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click', function(){ st.lang=b.dataset.lang; render(); }); });
  document.querySelectorAll('[data-screen]').forEach(function(b){ b.addEventListener('click', function(){ st.screen=b.dataset.screen; render(); }); });
  render();
})();
</script>
</body>
</html>
