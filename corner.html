<style>
/* Layout: phone-width column; search + filter chips, 2-column video cards (YouTube thumbnails); tap = player sheet with the YouTube video. */
:root{
  --ink:#1E1B4B; --muted:#6B6688; --bg:#FCF3EE;
  --rim:linear-gradient(135deg,#FFB3D6 0%,#fff 20%,#9FE6FF 40%,#fff 58%,#C9B2FF 76%,#FFC9A3 92%);
  --cta:linear-gradient(90deg,#FF8A3D 0%,#FF4F8B 50%,#A63CF0 100%);
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  background:
    radial-gradient(360px 360px at 0% 0%,rgba(255,205,215,.55),transparent 70%),
    radial-gradient(360px 360px at 100% 30%,rgba(201,178,255,.45),transparent 70%),
    radial-gradient(360px 360px at 0% 75%,rgba(255,201,163,.45),transparent 70%),
    linear-gradient(#FCF3EE,#F6EEF8);
  background-attachment:fixed;min-height:100vh}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #A63CF0;outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.glass,.glass-pill{border:1.3px solid transparent;
  background:linear-gradient(165deg,rgba(255,255,255,.82),rgba(255,255,255,.5)) padding-box, var(--rim) border-box;
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1.5px 0 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -10px 18px -14px rgba(139,92,246,.25), 0 8px 24px 0 rgba(139,92,246,.13), -8px 12px 24px -18px rgba(236,72,153,.35), 10px -4px 22px -18px rgba(6,182,212,.35)}
.glass{border-radius:22px}
.glass-pill{border-radius:999px}
.cta{border:0;background:var(--cta);color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;box-shadow:0 8px 18px -8px rgba(255,79,139,.6);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}

header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px}
header::before{content:"";position:absolute;inset:0 -16px;z-index:-1;background:linear-gradient(rgba(252,243,238,.88),rgba(252,243,238,.6));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.back{width:44px;height:44px;display:grid;place-items:center;text-decoration:none;flex-shrink:0}
.brand{font-weight:800;font-size:clamp(14px,4.1vw,18px);letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;padding:3px;gap:2px}
.lang button{border:0;background:transparent;font-weight:700;font-size:13px;padding:7px 9px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

.title{font-size:24px;font-weight:800;margin:4px 0 12px}
.lead{margin:-6px 0 12px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1.1;background:var(--cta);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12px;color:var(--muted);font-weight:700}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px;margin:0 0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1.3px solid transparent;font-weight:700;font-size:14px;padding:8px 14px}
.chips button[aria-pressed="true"]{background:var(--cta) padding-box,var(--cta) border-box;color:#fff;box-shadow:0 6px 14px -8px rgba(255,79,139,.7)}
.count{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v{border:0;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;border-radius:18px}
.v .th{position:relative;aspect-ratio:16/9;background:#eadff0;overflow:hidden}
.v .th img{display:block;width:100%;height:100%;object-fit:cover}
.v .play{position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(30,27,75,.62);display:grid;place-items:center;color:#fff}
.v .tag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:800;color:#fff;background:var(--cta);border-radius:999px;padding:2px 8px}
.v .tx{padding:8px 10px 10px;font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.v .yr{display:block;font-size:11.5px;color:var(--muted);font-weight:700;padding:0 10px 10px;margin-top:-6px}
.more{display:flex;margin:16px auto 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:16px 0 0;text-align:center}
.note a{color:#A63CF0;font-weight:700}

.pl{position:fixed;inset:0;z-index:60;background:rgba(14,12,36,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pl .box{width:100%;max-width:720px}
.pl .fr{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pl h3{color:#fff;font-size:16px;margin:14px 0 10px;text-align:center}
.pl .row{display:flex;justify-content:center}
.pl .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;border:0;background:rgba(255,255,255,.16);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;display:grid;place-items:center}

nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 8px;z-index:30}
nav.tabbar a,nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:18px}
nav.tabbar svg{width:24px;height:24px}
nav.tabbar .qr{margin-top:-30px}
nav.tabbar .qr .orb{width:62px;height:62px;border-radius:50%;background:var(--cta);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(255,79,139,.7), inset 0 2px 0 rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.8)}
nav.tabbar .qr span{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40}
</style>
</head>
