<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products · KickickLineDance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width column; TikBeli-Reward-style shop: spaced title pill, underline category tabs, 2-column square product cards. */
:root{
  --ink:#1E1B4B; --muted:#6B6688; --bg:#FCF3EE;
  --rim:linear-gradient(135deg,#FFB3D6 0%,#fff 20%,#9FE6FF 40%,#fff 58%,#C9B2FF 76%,#FFC9A3 92%);
  --cta:linear-gradient(90deg,#FF8A3D 0%,#FF4F8B 50%,#A63CF0 100%);
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  background:
    radial-gradient(360px 360px at 0% 0%,rgba(255,205,215,.55),transparent 70%),
    radial-gradient(360px 360px at 100% 30%,rgba(201,178,255,.45),transparent 70%),
    radial-gradient(360px 360px at 0% 75%,rgba(255,201,163,.45),transparent 70%),
    linear-gradient(#FCF3EE,#F6EEF8);
  background-attachment:fixed;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #A63CF0;outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.glass,.glass-pill{border:1.3px solid transparent;
  background:linear-gradient(165deg,rgba(255,255,255,.82),rgba(255,255,255,.5)) padding-box, var(--rim) border-box;
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1.5px 0 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -10px 18px -14px rgba(139,92,246,.25), 0 8px 24px 0 rgba(139,92,246,.13), -8px 12px 24px -18px rgba(236,72,153,.35), 10px -4px 22px -18px rgba(6,182,212,.35)}
.glass{border-radius:16px}
.glass-pill{border-radius:999px}
.cta{border:0;background:var(--cta);color:#fff;font-weight:700;border-radius:999px;padding:8px 12px;box-shadow:0 8px 18px -8px rgba(255,79,139,.6);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:13px}

header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px}
header::before{content:"";position:absolute;inset:0 -16px;z-index:-1;background:linear-gradient(rgba(252,243,238,.88),rgba(252,243,238,.6));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.back{width:44px;height:44px;display:grid;place-items:center;text-decoration:none;flex-shrink:0}
.brand{font-weight:800;font-size:clamp(14px,4.1vw,18px);letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;padding:3px;gap:2px}
.lang button{border:0;background:transparent;font-weight:700;font-size:13px;padding:7px 9px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

.ptitle{display:inline-block;padding:7px 16px;font-size:14px;font-weight:800;letter-spacing:3px;margin-top:6px}
.psub{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.ptabs{display:flex;align-items:center;gap:18px;padding:14px 0 12px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{border:0;background:transparent;padding:4px 0;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent}
.ptabs button[aria-pressed="true"]{color:var(--ink);border-image:var(--cta) 1;border-bottom-width:2.5px;border-bottom-style:solid}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:80px}
.pcard img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pcard .pi{padding:9px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .pn{font-size:13.5px;font-weight:700;line-height:1.3;min-height:2.6em}
.pcard .pp{display:flex;align-items:baseline;gap:6px}
.pcard .pp b{font-size:16px;font-weight:800;color:#E0327F;font-variant-numeric:tabular-nums}
.pcard .pp s{font-size:12px;font-weight:600;color:#A79FBE}
.pcard .cta{margin-top:auto}
.pcard:target{outline:2.5px solid #FF4F8B;outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:16px 0 0;text-align:center}

nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 8px;z-index:30;border-radius:24px}
nav.tabbar a,nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:18px}
nav.tabbar .on{color:#2563EB;background:linear-gradient(180deg,rgba(191,219,254,.7),rgba(255,255,255,.4))}
nav.tabbar svg{width:24px;height:24px}
nav.tabbar .qr{margin-top:-30px}
nav.tabbar .qr .orb{width:62px;height:62px;border-radius:50%;background:var(--cta);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(255,79,139,.7), inset 0 2px 0 rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.8)}
nav.tabbar .qr span{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back glass-pill" href="./" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="brand">KickickLineDance</div>
    <div class="lang glass-pill" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>
  <div class="ptitle glass-pill" data-t="prodTitle"></div>
  <div class="psub" data-t="prodSub"></div>
  <div class="ptabs" id="ptabs" role="group" aria-label="Product category"></div>
  <div class="pgrid" id="pgrid"></div>
  <p class="note" data-t="note"></p>
</div>

<nav class="tabbar glass" aria-label="Main">
  <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="navHome"></span></a>
  <a href="classes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span data-t="navClasses"></span></a>
  <button type="button" class="qr" data-soon><span class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><path d="M13 7h4v4M7 13v4h4"/></svg></span><span data-t="navQR"></span></button>
  <a href="products.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 7H6"/></svg><span data-t="navCart"></span></a>
  <button type="button" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-t="navMe"></span></button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var T={
    en:{prodTitle:'HOT SELLING PRODUCTS',prodSub:'Shop KICKICK dance gear now!',catAll:'All',catShoes:'Shoes',catWear:'Apparel',catAcc:'Accessories',order:'WhatsApp to order',note:'Sample products — real items and prices coming soon.',navHome:'Home',navClasses:'Classes',navQR:'My QR',navCart:'Cart',navMe:'Me',soon:'Coming soon'},
    zh:{prodTitle:'热卖商品',prodSub:'立即选购 KICKICK 舞蹈用品！',catAll:'全部',catShoes:'舞鞋',catWear:'服装',catAcc:'配件',order:'WhatsApp 下单',note:'示范商品，真实商品与价格即将上架。',navHome:'首页',navClasses:'课程',navQR:'我的 QR',navCart:'购物车',navMe:'我的',soon:'即将推出'}
  };
  // Sample products until the real catalogue arrives (photos generated in ChatGPT). Orders go to Wendy on WhatsApp.
  var WA='60123333332';
  var PRODUCTS=[
    {id:'p-shoes',cat:'shoes',price:'RM129',was:'RM159',en:'KICKICK Line Dance Sneakers',zh:'KICKICK 排舞软底鞋'},
    {id:'p-tee',cat:'wear',price:'RM45',was:'RM59',en:'KICKICK Team T-Shirt',zh:'KICKICK 团队 T 恤'},
    {id:'p-jacket',cat:'wear',price:'RM89',was:'RM120',en:'Performance Jacket',zh:'表演外套'},
    {id:'p-hat',cat:'acc',price:'RM39',was:'RM49',en:'Line Dance Cowboy Hat',zh:'排舞牛仔帽'},
    {id:'p-skirt',cat:'wear',price:'RM59',was:'RM79',en:'Flow Dance Skirt',zh:'舞蹈飘逸长裙'},
    {id:'p-bottle',cat:'acc',price:'RM29',was:'RM35',en:'KICKICK Water Bottle',zh:'KICKICK 保温水瓶'}
  ];
  var st={lang:'en',cat:'all'};
  try{ if(localStorage.getItem('kld_lang')==='zh') st.lang='zh'; }catch(e){}
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function renderAll(){
    var t=T[st.lang]; document.documentElement.lang=st.lang==='zh'?'zh':'en';
    document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent=t[e.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===st.lang); });
    var tabs=document.getElementById('ptabs'); tabs.innerHTML='';
    [['all',t.catAll],['shoes',t.catShoes],['wear',t.catWear],['acc',t.catAcc]].forEach(function(x){
      var b=el('button',null,x[1]); b.type='button'; b.setAttribute('aria-pressed',st.cat===x[0]);
      b.onclick=function(){ st.cat=x[0]; renderAll(); }; tabs.appendChild(b);
    });
    var g=document.getElementById('pgrid'); g.innerHTML='';
    PRODUCTS.filter(function(p){ return st.cat==='all'||p.cat===st.cat; }).forEach(function(p){
      var c=el('div','pcard glass'); c.id=p.id;
      var im=el('img'); im.src=p.id+'.jpg'; im.alt=p[st.lang]; im.loading='lazy'; c.appendChild(im);
      var i=el('div','pi'); i.appendChild(el('div','pn',p[st.lang]));
      var pr=el('div','pp'); pr.appendChild(el('b',null,p.price)); pr.appendChild(el('s',null,p.was)); i.appendChild(pr);
      var msg=(st.lang==='zh'?'你好，我想购买 ':'Hi, I would like to order ')+p[st.lang]+' ('+p.price+')';
      var w=el('a','cta',t.order); w.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg); w.target='_blank'; w.rel='noopener'; i.appendChild(w);
      c.appendChild(i); g.appendChild(c);
    });
    try{ localStorage.setItem('kld_lang',st.lang); }catch(e){}
  }
  var tt; function soon(e){ if(e) e.preventDefault(); var x=document.getElementById('toast'); x.textContent=T[st.lang].soon; x.hidden=false; clearTimeout(tt); tt=setTimeout(function(){x.hidden=true;},1600); }
  document.querySelectorAll('[data-soon]').forEach(function(b){ b.addEventListener('click',soon); });
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click',function(){ st.lang=b.dataset.lang; renderAll(); }); });
  renderAll();
  if(location.hash){ var x=document.getElementById(location.hash.slice(1)); if(x) x.scrollIntoView({block:'center'}); }
})();
</script>
</body>
</html>
