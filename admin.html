<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · KickickLineDance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: Wendy's everyday admin home, phone first (2 columns from 900px): today hero → key numbers → quick actions → today's classes → this week → to-do. Same glass system as the public site. */
:root{
  --ink:#1E1B4B; --muted:#6B6688; --faint:#E9E2F2;
  --rim:linear-gradient(135deg,#FFB3D6 0%,#fff 20%,#9FE6FF 40%,#fff 58%,#C9B2FF 76%,#FFC9A3 92%);
  --cta:linear-gradient(90deg,#FF8A3D 0%,#FF4F8B 50%,#A63CF0 100%);
  --good:#1FA971; --goodbg:#E3F6EE; --live:#2563EB; --livebg:#E3EDFD; --warn:#B45309; --warnbg:#FEF3C7;
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  background:
    radial-gradient(360px 360px at 0% 0%,rgba(255,205,215,.55),transparent 70%),
    radial-gradient(360px 360px at 100% 30%,rgba(201,178,255,.45),transparent 70%),
    radial-gradient(360px 360px at 0% 75%,rgba(255,201,163,.45),transparent 70%),
    linear-gradient(#FCF3EE,#F6EEF8);
  background-attachment:fixed;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #A63CF0;outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:0 16px 40px}
.glass,.glass-pill{border:1.3px solid transparent;
  background:linear-gradient(165deg,rgba(255,255,255,.86),rgba(255,255,255,.55)) padding-box, var(--rim) border-box;
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1.5px 0 0 rgba(255,255,255,.95), 0 8px 24px 0 rgba(139,92,246,.12), -8px 12px 24px -18px rgba(236,72,153,.3), 10px -4px 22px -18px rgba(6,182,212,.3)}
.glass{border-radius:22px}
.glass-pill{border-radius:999px}

header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px}
header::before{content:"";position:absolute;inset:0 -16px;z-index:-1;background:linear-gradient(rgba(252,243,238,.9),rgba(252,243,238,.65));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{width:46px;height:46px;border-radius:15px;overflow:hidden;flex-shrink:0;display:block}
.logo img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.who b{display:block;font-size:16.5px;font-weight:800;line-height:1.25}
.lang{display:flex;padding:3px;gap:2px;flex-shrink:0}
.lang button{border:0;background:transparent;font-weight:700;font-size:13px;padding:7px 9px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

section{margin-top:20px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
.sh h2{font-size:17px;margin:0;font-weight:800}
.sh a{font-size:13px;font-weight:800;color:#A63CF0;text-decoration:none;white-space:nowrap}

/* today hero */
.hero{border-radius:26px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;border:1.3px solid transparent;margin-top:4px;
  background:linear-gradient(135deg,rgba(255,138,61,.92),rgba(255,79,139,.9) 50%,rgba(166,60,240,.9)) padding-box,var(--rim) border-box;
  box-shadow:0 18px 40px -18px rgba(166,60,240,.55)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.92}
.hero .n{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin:4px 0;font-variant-numeric:tabular-nums}
.hero .d{font-size:14.5px;opacity:.96;position:relative}
.hero .next{margin-top:12px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;position:relative}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{padding:14px;display:flex;gap:12px;align-items:center;text-decoration:none}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9)}
.ic svg{width:22px;height:22px}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .t{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qa a,.qa button{border:0;background:transparent;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.25;padding:0}
.qa .tile{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;border:1.3px solid transparent}
.qa .tile svg{width:26px;height:26px}

/* class lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--faint)}
.row:last-child{border-bottom:0}
.time{text-align:center;line-height:1.1}
.time b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.time span{font-size:11.5px;color:var(--muted)}
.cls{min-width:0}
.cls b{display:block;font-size:14.5px;line-height:1.3}
.cls span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.done{background:#EEEAF4;color:var(--muted)}
.st.live{background:var(--goodbg);color:var(--good)}
.st.soon{background:var(--livebg);color:var(--live)}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}

.week .day{padding:10px 14px;border-bottom:1px solid var(--faint);display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.week .day:last-child{border-bottom:0}
.week .dn{font-weight:800;font-size:14px}
.week .dn.today{color:#C02F7A}
.week .ds{font-size:13px;display:flex;flex-direction:column;gap:2px}
.week .ds span{color:var(--muted)}

/* to-do */
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--faint);text-decoration:none}
.todo:last-child{border-bottom:0}
.todo .ic{width:38px;height:38px;border-radius:12px}
.todo .ic svg{width:19px;height:19px}
.todo div{flex:1;min-width:0}
.todo b{display:block;font-size:14px}
.todo span{display:block;font-size:12.5px;color:var(--muted)}
.todo i{font-style:normal;font-size:20px;color:var(--muted)}

.foot{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40}

@media (min-width:900px){
  .top{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
  .top .kpis{margin-top:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .qa{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="logo glass" href="./" aria-label="Public site"><img src="app-logo.png" alt=""></a>
    <div class="who"><small id="today"></small><b data-t="hello"></b></div>
    <div class="lang glass-pill" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <div class="top">
    <div class="hero">
      <div class="k" data-t="heroK"></div>
      <div class="n" id="heroN"></div>
      <div class="d" id="heroD"></div>
      <div class="next" id="heroNext"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <section>
    <div class="sh"><h2 data-t="qaTitle"></h2></div>
    <div class="qa" id="qa"></div>
  </section>

  <div class="two">
    <section>
      <div class="sh"><h2 id="todayTitle"></h2><a href="classes.html" data-t="allClasses"></a></div>
      <div class="glass list" id="todayList"></div>
    </section>
    <section>
      <div class="sh"><h2 data-t="weekTitle"></h2></div>
      <div class="glass week" id="week"></div>
    </section>
  </div>

  <section>
    <div class="sh"><h2 data-t="todoTitle"></h2></div>
    <div class="glass" id="todo"></div>
  </section>

  <p class="foot" data-t="foot"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  /* Real weekly timetable (from the intake posters). day: 0=Sun … 6=Sat; end null = not on the poster. */
  var CLASSES=[
    {day:1,start:'09:30',end:'11:00',en:['Square Dance · Bandar Puteri','Tip Tap Toe Fitness Studio · Ann Soh & Wendy Loh'],zh:['广场舞 · Bandar Puteri','Tip Tap Toe Fitness Studio · 猫妹 Ann Soh & 猫姐 Wendy']},
    {day:3,start:'08:00',end:'09:30',en:['Square Dance · Cheras','Komune Living, Tasik Permaisuri · Wendy Loh & Adelyn Pong'],zh:['广场舞 · 蕉赖','Komune Living, Tasik Permaisuri · 猫姐 Wendy & Adelyn Pong']},
    {day:4,start:'09:00',end:null,en:['Square Dance · Kajang','Kajang Hokkien Association · Jane Tang'],zh:['广场舞 · 加影','加影福建会馆 · Jane Tang 老师']},
    {day:4,start:'19:00',end:'20:30',en:['Square Dance · Putra Prima','X2 Residency sky lounge · Wiwien Loh & Ann Soh'],zh:['广场舞 · Putra Prima','X2 Residency 空中会所 · Wiwien Loh & Ann Soh']},
    {day:5,start:'18:00',end:'19:30',en:['Square Dance · Seri Kembangan','Dewan Dr. George Lim Ah Soo · Melvin Tan & Wendy Loh'],zh:['广场舞 · Seri Kembangan','Dewan Dr. George Lim Ah Soo · 猫哥 Melvin & Wendy']},
    {day:6,start:'09:00',end:'10:30',en:['Square Dance · OUG (Beginner)','Dewan Komuniti OUG · Wendy Loh & Rowena Hu'],zh:['广场舞 · OUG（初级）','华联会所 · Wendy Loh & Rowena Hu']},
    {day:6,start:'10:30',end:'12:00',en:['Square Dance · OUG (Intermediate)','Dewan Komuniti OUG · Wendy Loh & Rowena Hu'],zh:['广场舞 · OUG（中级）','华联会所 · Wendy Loh & Rowena Hu']}
  ];
  var TEACHERS=7, VENUES=6, AREAS=4, EVENT_REG=472;
  var ICONS={
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
    qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>',
    cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
    chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg>',
    mega:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1Z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>',
    bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
    tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>'
  };
  var TINT={pink:['#FFE3EF','#C02F7A'],violet:['#EDE7FE','#6D4BD8'],blue:['#E3EDFD','#2563EB'],green:['#E3F6EE','#14804F'],amber:['#FEF3C7','#B45309'],peach:['#FFE9DE','#C2410C']};
  var T={
    en:{hello:'Good morning, Wendy',hello2:'Good afternoon, Wendy',hello3:'Good evening, Wendy',
      heroK:'Today',classesToday:'{n} classes today',noneToday:'No class today',restDay:'Enjoy your rest day',
      next:'Next: {t} · {c}',allDone:'All of today’s classes are done',
      k1:'Classes a week',k2:'Teachers',k3:'Venues in {a} areas',k4:'Workshop sign-ups',
      qaTitle:'Quick actions',qa:['Check-in','Add student','Payment','Announce','Classes','Workshop report','Shop','Pricing'],
      todayTitle:'Today’s classes',allClasses:'All classes →',done:'Done',live:'On now',soon:'Later',
      weekTitle:'This week',todoTitle:'To do',
      todo:[['Set the fee for each class','Classes show “ask the teacher” until fees are added','tag','amber','classes.html'],
            ['Put Nasi Lemak sign-ups into a private list','472 names are still on paper and photos','list','violet','events.html'],
            ['Send the real shop products','The shop has 6 sample products','bag','pink','products.html'],
            ['Start check-in at classes','Student numbers, attendance and money will show here after the first check-ins','qr','blue',null]],
      foot:'Timetable from the 2026 intake posters. Money and student numbers appear once check-in and payments are recorded here.',
      days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],noClass:'No class',soonToast:'Coming soon',am:'AM',pm:'PM'},
    zh:{hello:'早安，Wendy',hello2:'午安，Wendy',hello3:'晚上好，Wendy',
      heroK:'今天',classesToday:'今天 {n} 堂课',noneToday:'今天没有课',restDay:'好好休息一下',

      k1:'每周课堂',k2:'老师',k3:'{a} 个地区的场地',k4:'体验日报名',
      qaTitle:'快捷功能',qa:['扫码签到','新增学生','记录付款','发公告','课程','活动报告','商店','收费方案'],
      todayTitle:'今日课程',allClasses:'全部课程 →',done:'已完成',live:'进行中',soon:'稍后',
      weekTitle:'本周课表',todoTitle:'待办事项',
      todo:[['为每堂课设定学费','课程页目前显示“请向老师询问”','tag','amber','classes.html'],
            ['把 Nasi Lemak 报名名单整理成私人表格','472 个名字还在纸上和照片里','list','violet','events.html'],
            ['提供商店的真实商品','商店目前是 6 个示范商品','bag','pink','products.html'],
            ['开始在课堂扫码签到','开始签到后，学生人数、出席和收款会显示在这里','qr','blue',null]],
      foot:'课表来自 2026 年招生海报。开始签到和记录付款后，收款与学生人数会显示在这里。',
      days:['星期日','星期一','星期二','星期三','星期四','星期五','星期六'],noClass:'没有课',soonToast:'即将推出',am:'上午',pm:'下午'}
  };
  var st={lang:'en'};
  try{ if(localStorage.getItem('kld_lang')==='zh') st.lang='zh'; }catch(e){}
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function mins(hhmm){ var p=hhmm.split(':'); return +p[0]*60+ +p[1]; }
  function hm(hhmm){ var p=hhmm.split(':'), h=+p[0]; return {t:((h+11)%12+1)+':'+p[1], ap:h<12?'am':'pm'}; }
  function icon(name,tint){ var d=el('span','ic'); d.innerHTML=ICONS[name]; d.style.background=TINT[tint][0]; d.style.color=TINT[tint][1]; return d; }
  var tt; function soon(e){ if(e) e.preventDefault(); var x=document.getElementById('toast'); x.textContent=T[st.lang].soonToast; x.hidden=false; clearTimeout(tt); tt=setTimeout(function(){x.hidden=true;},1600); }

  function render(){
    var t=T[st.lang], now=new Date(), wd=now.getDay(), nowM=now.getHours()*60+now.getMinutes();
    document.documentElement.lang=st.lang==='zh'?'zh':'en';
    document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent=t[e.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===st.lang); });
    document.querySelector('[data-t="hello"]').textContent = now.getHours()<12?t.hello:(now.getHours()<18?t.hello2:t.hello3);
    document.getElementById('today').textContent = now.toLocaleDateString(st.lang==='zh'?'zh-CN':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    var today=CLASSES.filter(function(c){return c.day===wd;});
    function status(c){ var s=mins(c.start), e=c.end?mins(c.end):s+90; return nowM>=e?'done':(nowM>=s?'live':'soon'); }

    var nx=today.filter(function(c){return status(c)!=='done';})[0], hn=document.getElementById('heroNext');
    if(today.length){ hn.hidden=false; if(nx){ var h=hm(nx.start); hn.textContent=t.next.replace('{t}',h.t+' '+t[h.ap]).replace('{c}',nx[st.lang][0].split(' · ').pop()); } else hn.textContent=t.allDone; } else hn.hidden=true;

    var K=document.getElementById('kpis'); K.innerHTML='';
    [[CLASSES.length,t.k1,'cal','pink','classes.html'],[TEACHERS,t.k2,'users','violet','./#teachers'],[VENUES,t.k3.replace('{a}',AREAS),'pin','blue','classes.html'],[EVENT_REG,t.k4,'star','amber','events.html']].forEach(function(k){
      var a=el('a','kpi glass'); a.href=k[4]; a.appendChild(icon(k[2],k[3]));

    });

    var Q=document.getElementById('qa'); Q.innerHTML='';
    [['qr','blue',null],['plus','green',null],['cash','amber',null],['mega','pink',null],['cal','violet','classes.html'],['chart','peach','events.html'],['bag','pink','products.html'],['tag','green',null]].forEach(function(q,i){
      var a=q[2]?el('a'):el('button'); if(q[2]) a.href=q[2]; else { a.type='button'; a.addEventListener('click',soon); }
      var tile=el('span','tile glass'); tile.innerHTML=ICONS[q[0]]; tile.style.color=TINT[q[1]][1];
      tile.style.background='linear-gradient(165deg,'+TINT[q[1]][0]+',rgba(255,255,255,.7)) padding-box, var(--rim) border-box';
      a.appendChild(tile); a.appendChild(document.createTextNode(t.qa[i])); Q.appendChild(a);
    });

    document.getElementById('todayTitle').textContent=t.todayTitle+' · '+today.length;
    var L=document.getElementById('todayList'); L.innerHTML='';
    if(!today.length) L.appendChild(el('div','empty',t.noneToday));
    today.forEach(function(c){
      var r=el('div','row'), h=hm(c.start), tm=el('div','time'); tm.appendChild(el('b',null,h.t)); tm.appendChild(el('span',null,t[h.ap])); r.appendChild(tm);
      var d=el('div','cls'); d.appendChild(el('b',null,c[st.lang][0])); d.appendChild(el('span',null,c[st.lang][1])); r.appendChild(d);
      var s=status(c); r.appendChild(el('span','st '+s,t[s])); L.appendChild(r);
    });

    var W=document.getElementById('week'); W.innerHTML='';
    [1,2,3,4,5,6,0].forEach(function(dn){
      var list=CLASSES.filter(function(c){return c.day===dn;});
      var r=el('div','day'); r.appendChild(el('div','dn'+(dn===wd?' today':''),t.days[dn]));
      var ds=el('div','ds');
      if(!list.length) ds.appendChild(el('span',null,t.noClass));
      list.forEach(function(c){ var h=hm(c.start); ds.appendChild(el('div',null,h.t+' '+t[h.ap]+' · '+c[st.lang][0].split(' · ').slice(1).join(' · '))); });
      r.appendChild(ds); W.appendChild(r);
    });

    var D=document.getElementById('todo'); D.innerHTML='';
    t.todo.forEach(function(x){
      var a=x[4]?el('a','todo'):el('div','todo'); if(x[4]) a.href=x[4];
      a.appendChild(icon(x[2],x[3])); var d=el('div'); d.appendChild(el('b',null,x[0])); d.appendChild(el('span',null,x[1])); a.appendChild(d);
      if(x[4]) a.appendChild(el('i',null,'›')); D.appendChild(a);
    });
    try{ localStorage.setItem('kld_lang',st.lang); }catch(e){}
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click',function(){ st.lang=b.dataset.lang; render(); }); });
  render();
})();
</script>
<script src="admin-nav.js" data-active="dashboard"></script>
</body>
